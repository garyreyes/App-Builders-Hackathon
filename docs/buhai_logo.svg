<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" fill="#FFFFFF" rx="24" />

  <!-- Icon Container: Red Rounded Shield Box -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="180" height="180" rx="36" fill="url(#redGrad)" />
    
    <!-- White Medical Plus Accent inside Shield -->
    <path d="M90 45 V135 M45 90 H135" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.18" />

    <!-- Giant Stylized Bold Letter B in White -->
    <path d="M 62 48 
             L 106 48 
             C 126 48, 140 60, 140 76 
             C 140 90, 128 100, 114 104 
             C 132 108, 146 120, 146 138 
             C 146 156, 128 168, 106 168 
             L 62 168 
             Z 
             M 84 68 
             L 84 98 
             L 104 98 
             C 114 98, 120 92, 120 83 
             C 120 74, 114 68, 104 68 
             Z 
             M 84 118 
             L 84 148 
             L 106 148 
             C 116 148, 124 142, 124 133 
             C 124 124, 116 118, 106 118 
             Z" 
          fill="#FFFFFF" />

    <!-- Crisp Medical Cross embedded in center right -->
    <circle cx="150" cy="50" r="14" fill="#FFFFFF" />
    <path d="M150 42 V58 M142 50 H158" stroke="#E53935" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Wordmark: 'uh.ai' -->
  <g transform="translate(250, 160)">
    <!-- 'uh' in Bold Emergency Red -->
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="112" fill="#D32F2F" letter-spacing="-2">
      uh
    </text>

    <!-- '.ai' in Sleek Dark Charcoal with Red Accent Dot -->
    <text x="145" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="112" fill="#212121" letter-spacing="-1">
      <tspan fill="#D32F2F">.</tspan>ai
    </text>

    <!-- Subtitle: Local Offline Health -->
    <text x="6" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#757575" letter-spacing="3">
      OFFLINE HEALTH ASSISTANT
    </text>
  </g>
</svg>

